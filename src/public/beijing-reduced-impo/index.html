<script>
window.config = {

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    #license-overlay {
      position: fixed;
      inset: 0;
      background: #0e0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: 'Inter', system-ui, sans-serif;
      color: #e8e8f0;
      background-image: radial-gradient(ellipse at 20% 20%, rgba(124,92,252,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 80%, rgba(91,63,212,0.06) 0%, transparent 60%);
    }

    #license-modal {
      background: #13131f;
      border: 1px solid #1e1e30;
      border-radius: 14px;
      padding: 2.5rem;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    #license-modal::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,92,252,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    #license-modal h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    #license-modal h1 span { color: #7c5cfc; }

    #license-modal p {
      font-size: 0.85rem;
      color: #8a8a9a;
      margin-bottom: 2rem;
    }

    #license-input {
      box-sizing: border-box;
      width: 100%;
      background: #0a0a10;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 1px;
    }

    #license-input:focus {
      border-color: #7c5cfc;
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }

    #license-btn {
      box-sizing: border-box;
      width: 100%;
      background: #7c5cfc;

    #license-btn:hover { background: #6b4df0; }

    }
</style>

<body>
    <div id="license-overlay">
  <div id="license-modal">
    <h1>Volt <span>Maps</span></h1>
    <p>Please enter your license key for <strong>Reduced Impo</strong>.</p>
    <input type="text" id="license-input" placeholder="REDIMP-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
    <button id="license-btn" onclick="verifyKey()">Unlock Map</button>
    
    <div class="paypal-link">
      <a href="https://paypal.me/AdamMezerai" target="_blank">Pas de clé ? Obtenir une clé sur PayPal</a>
      <span>⚠️ Important : Ajoute ton pseudo Discord en note lors du paiement pour recevoir ta clé !</span>
    </div>

    <div id="license-error"></div>
  </div>
</div>

<script>
  async function getHWID() {
    const cached = localStorage.getItem('volt_hwid');
    if (cached) return cached;
    const parts = [];
    try { parts.push(navigator.userAgent || ''); } catch {}
    try { parts.push((navigator.languages || [navigator.language || '']).join(',')); } catch {}
    try { parts.push(`${screen.width}x${screen.height}x${screen.colorDepth}`); } catch {}
    try { parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || ''); } catch {}
    try { parts.push(String(navigator.hardwareConcurrency || '')); } catch {}
    try { parts.push(navigator.platform || ''); } catch {}
    try { parts.push(String(new Date().getTimezoneOffset())); } catch {}
    try {
      const c = document.createElement('canvas');
      c.width = 280; c.height = 60;
      const ctx = c.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = "16px 'Arial'";
      ctx.fillStyle = '#f60';
      ctx.fillRect(0, 0, 280, 60);
      ctx.fillStyle = '#069';
      ctx.fillText('VoltMaps-HWID-⚡', 2, 2);
      ctx.fillStyle = 'rgba(102,204,0,0.7)';
      ctx.fillText('VoltMaps-HWID-⚡', 4, 4);
      parts.push(c.toDataURL());
    } catch {}
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      if (gl) {
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        if (ext) {
          parts.push(gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || '');
          parts.push(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '');
        }
      }
    } catch {}
    const text = parts.join('||');
    const buf = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    const hwid = 'HWID-' + hex.slice(0, 32);
    localStorage.setItem('volt_hwid', hwid);
    return hwid;
  }

  function loadGame() {
    document.getElementById('license-overlay').style.display = 'none';

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/css/nocoin-modal.css';
    document.head.appendChild(link);

    const loadScript = (src) => new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = resolve;
      document.body.appendChild(s);
    });

    (async () => {
      await loadScript('/js/nocoin-storage.js');
      await loadScript('/js/nocoin-content.js');
      await loadScript('/js/poki-stubs.js');
      await loadScript('master-loader.js');
    })();
  }

  async function verifyKey() {
    const keyInput = document.getElementById('license-input');
    const btn = document.getElementById('license-btn');
    const errorDiv = document.getElementById('license-error');
    
    const key = keyInput.value.trim();
    if (!key) {
      errorDiv.textContent = 'Please enter a valid key.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verifying...';
    errorDiv.textContent = '';

    try {
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          key: key,
          hwid: await getHWID(),
          mapType: 'redimp'
        })
      });
      
      const data = await res.json();
      
      if (res.ok && data.success) {
        localStorage.setItem('volt_key_redimp', key);
        loadGame();
      } else {
        errorDiv.textContent = data.error || 'Invalid key.';
        btn.disabled = false;
        btn.textContent = 'Unlock Map';
      }
    } catch (e) {
      errorDiv.textContent = 'Network error. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Unlock Map';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('volt_key_redimp');
    if (savedKey) {
      const keyInput = document.getElementById('license-input');
      keyInput.value = savedKey;
      verifyKey();
    }
  });
</script>
</body>
</html>
